services:
  - type: web
    name: mi-backend
    env: python
    plan: free
    buildCommand: "pip install --prefer-binary --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        value: "postgresql+psycopg2://admin:1234*@localhost/mibasedatos"
    autoDeploy: true
