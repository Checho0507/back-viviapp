services:
  - type: web
    name: mi-backend
    env: python
    plan: free
    pythonVersion: 3.11.9
    buildCommand: "pip install --prefer-binary --no-cache-dir -r requirements.txt"
    startCommand: "gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        value: "postgresql+psycopg2://usuario:password@host:puerto/db?sslmode=require"
